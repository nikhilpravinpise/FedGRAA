name: docs-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  doc-links-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check PAKDD documentation links
        run: python PAKDD/scripts/check_doc_links.py

      - name: Byte-compile all Python sources (syntax check)
        run: python -m compileall -q PAKDD/fedgraa PAKDD/scripts PAKDD/tests
