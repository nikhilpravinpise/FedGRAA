name: docs-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  doc-links-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to an exact patch release, not just "3.13": an unpinned
          # minor-version spec can float onto a runner image with a
          # different CPU-generation/AVX512 baseline between runs, which
          # PRE_COMPUTE_AUDIT_2026-07-28.md's M7 flagged as a source of
          # non-deterministic CI failures. Match this to the local dev
          # environment's version when bumping.
          python-version: "3.13.14"

      - name: Check FedGRAA documentation links
        run: python FedGRAA/scripts/check_doc_links.py

      - name: Byte-compile all Python sources (syntax check)
        run: python -m compileall -q FedGRAA/fedgraa FedGRAA/scripts FedGRAA/tests

  stage-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FedGRAA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to an exact patch release, not just "3.13": an unpinned
          # minor-version spec can float onto a runner image with a
          # different CPU-generation/AVX512 baseline between runs, which
          # PRE_COMPUTE_AUDIT_2026-07-28.md's M7 flagged as a source of
          # non-deterministic CI failures. Match this to the local dev
          # environment's version when bumping.
          python-version: "3.13.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests --tb=short

      - name: Stage A completeness gate
        run: python scripts/check_stage_a_complete.py

      - name: Stage B completeness gate
        run: python scripts/check_stage_b_complete.py

      - name: Stage A correctness audit (recomputes every transcribed number from raw JSON)
        run: python scripts/audit_stage_a.py

      - name: Stage B correctness audit (recomputes every transcribed number from raw JSON)
        run: python scripts/audit_stage_b.py

      - name: Stage C completeness gate (T1-T6, TC)
        run: python scripts/check_stage_c_complete.py --tier T1 T2 T3 T4 T5 T6 TC --t4-m 3

      - name: Stage C completeness gate (T7, 5-seed grid)
        run: python scripts/check_stage_c_complete.py --tier T7 --seeds 0 1 2 3 4

      - name: Stage C correctness audit (recomputes every transcribed number from raw JSON)
        run: python scripts/audit_stage_c.py
